<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — The Great Turkey Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--stage-sky, #7ec8f2); }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Dash: a turkey runs from the farmer. Jump the fences, duck the knives, reach the forest."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
